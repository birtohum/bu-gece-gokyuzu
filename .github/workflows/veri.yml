name: veri
# CelesTrak'tan yörünge öğelerini günde dört kez çeker; değiştiyse kaydeder ve siteyi yeniden yayınlar.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 1,7,13,19 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: veri
  cancel-in-progress: false

jobs:
  veri:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python veri_cek.py
      - name: Kaydet ve yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/veri/uydular.json
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -q -m "veri: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          gh workflow run yayin.yml --ref main
